#version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-binding-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - laravel

  webserver:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: rtb_db
        MYSQL_USER: laravel
        MYSQL_PASSWORD: laravel
        MYSQL_ROOT_HOST: '%'
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    ports:
        - "3306:3306"
    volumes:
        - db_data:/var/lib/mysql
    networks:
        - laravel
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 5s
        retries: 10

networks:
  laravel:

volumes:
  db_data:
