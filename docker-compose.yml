version: '3.8'
REDIS_HOST: redis
networks:
- rtbnet


webserver:
image: nginx:stable
volumes:
- ./:/var/www/html
- ./nginx/default.conf:/etc/nginx/conf.d/default.conf
ports:
- "8000:80"
depends_on:
- app
networks:
- rtbnet


db:
image: mysql:8.0
environment:
MYSQL_DATABASE: rtb
MYSQL_ROOT_PASSWORD: secret
ports:
- "3306:3306"
volumes:
- dbdata:/var/lib/mysql
networks:
- rtbnet


redis:
image: redis:6
ports:
- "6379:6379"
networks:
- rtbnet


worker:
build: .
volumes:
- ./:/var/www/html
command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
depends_on:
- redis
- db
environment:
QUEUE_CONNECTION: redis
REDIS_HOST: redis
networks:
- rtbnet


scheduler:
build: .
volumes:
- ./:/var/www/html
command: >
sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
depends_on:
- app
networks:
- rtbnet


volumes:
dbdata:


networks:
rtbnet:
